<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
<title id="title">gex-terminal — Terminal and Market Wind Tunnel</title>
<desc id="description">Illustrative product artwork, not a screenshot or market result. One local installation offers a Terminal replay dashboard and Market Wind Tunnel browser workbench. The starter can launch both from registered saved ES or NQ data. Wind Tunnel compares default and directionalized proxies and tests price, IV and model-time assumptions against frozen inputs. Source and model identity remain inspectable, with full reproducible receipts. Saved-data workflows require no provider connection. Derived from README.md and docs/architecture.md.</desc>
