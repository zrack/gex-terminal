[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-terminal"
version = "0.5.0"
description = "Terminal UI for intraday gamma exposure and options market structure."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "M. Scott Zeitner" }
]
keywords = [
    "gamma-exposure",
    "gex",
    "options",
    "futures",
    "terminal",
    "textual",
    "market-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "aiohttp>=3.9.0",
    "numpy==2.4.6",
    "python-dotenv>=1.0.0",
    "textual==8.2.7",
    "websockets>=12.0",
]

[project.optional-dependencies]
databento = ["databento>=0.83.0,<0.84.0"]
ibkr = ["ib_insync>=0.9.86"]
yfinance = ["yfinance>=0.2.40"]
providers = [
    "databento>=0.83.0,<0.84.0",
    "ib_insync>=0.9.86",
    "yfinance>=0.2.40",
]

[project.urls]
Homepage = "https://github.com/zrack/gex-terminal"
Repository = "https://github.com/zrack/gex-terminal"
Issues = "https://github.com/zrack/gex-terminal/issues"

[project.scripts]
gex-terminal = "gex_terminal.cli:main_sync"

[tool.setuptools]
packages = [
    "gex_terminal",
    "gex_terminal.adapters",
    "gex_terminal.data",
    "gex_terminal.data.replays",
    "gex_terminal.data.provider_fixtures",
]

[tool.setuptools.package-data]
gex_terminal = [
    "*.tcss",
    "data/replays/*.jsonl",
    "data/provider_fixtures/*",
]
